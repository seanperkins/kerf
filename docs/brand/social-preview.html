<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LoftLine social preview</title>
<!-- 1280 x 640 card for docs/images/social-preview.png; the recipe is in docs/brand/README.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@500&display=swap">
<style>
  :root { --surface: #111317; --text: #ECEEF1; --muted: #9AA3B0; --accent: #C6EE3A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: var(--surface); }
  .card { position: relative; width: 1280px; height: 640px; background: var(--surface); }
  .lockup { position: absolute; left: 72px; top: 52px; height: 76px; }
  .tagline { position: absolute; left: 72px; top: 150px; margin: 0; font: 500 28px/1.3 'IBM Plex Sans', system-ui, sans-serif; color: var(--muted); }
  .chips { position: absolute; right: 72px; top: 64px; margin: 0; text-align: right; font: 400 22px/1.45 'IBM Plex Mono', ui-monospace, monospace; color: var(--muted); }
  .chips b { color: var(--accent); font-weight: 500; }
  .render { position: absolute; left: 72px; bottom: 0; width: 1136px; display: block; border: 1px solid #2B313A; border-bottom: 0; border-radius: 20px 20px 0 0; }
</style>
</head>
<body>
<div class="card">
  <img class="lockup" src="lockup-h-dark.svg" alt="LoftLine">
  <p class="tagline">CAD/CAM for CNC routers, native on the Mac</p>
  <p class="chips">design <b>→</b> toolpaths<br>3D preview <b>→</b> G-code</p>
  <img class="render" src="../../.tmp/sign-3d.png" alt="The sample sign in the 3D preview">
</div>
</body>
</html>
