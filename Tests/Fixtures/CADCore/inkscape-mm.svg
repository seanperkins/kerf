<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- 100 x 50 mm page, Inkscape-style layers, 1 user unit = 1 mm. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="100mm" height="50mm" viewBox="0 0 100 50">
  <defs>
    <circle id="dot" r="2"/>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Outline" id="layer1">
    <rect id="border" x="0" y="0" width="100" height="50"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Holes" id="layer2" transform="translate(10,10)">
    <circle id="hole1" cx="0" cy="0" r="5"/>
    <use xlink:href="#dot" x="20" y="0"/>
    <g transform="scale(2)">
      <ellipse id="oval" cx="20" cy="5" rx="4" ry="2"/>
    </g>
  </g>
  <g inkscape:label="Hidden" style="display:none">
    <rect x="1" y="1" width="2" height="2"/>
  </g>
  <line id="loose" x1="0" y1="50" x2="100" y2="0"/>
  <text x="5" y="5">ignored</text>
</svg>
